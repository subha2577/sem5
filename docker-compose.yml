version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recoverai-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:///./recoverai.db
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    container_name: recoverai-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run build && npx -y serve -s dist -l 5173"
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
